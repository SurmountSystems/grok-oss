[package]
license = "Apache-2.0"
name = "xai-sqlite-journal"
version = "0.1.0"
edition.workspace = true
description = "Filesystem-aware SQLite journal-mode selection: WAL on local disks, rollback journal on network mounts where WAL's mmap'd -shm is unsafe"

[dependencies]
# Matches rusqlite 0.43 of every consumer. Bundled SQLite is libsqlite3-sys `bundled`.
# Required libsqlite3-sys is 0.40.0.
rusqlite = { version = "0.43" }
libsqlite3-sys = { version = "0.40", features = ["bundled"] }
strum = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Same per-crate pin as xai-crash-handler / xai-system-power / xai-grok-pager
# (windows-sys has no workspace entry).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
