[package]
license = "Apache-2.0"
name = "xai-grok-dashboard-store"
version = "0.1.0"
edition.workspace = true
description = "SQLite-backed persistent dashboard workspace: membership, layout ranks, grouping"

[dependencies]
# rusqlite 0.43. libsqlite3-sys `bundled` keeps SQLite self-contained.
# Keep in step with xai-sqlite-journal. Required libsqlite3-sys is 0.40.0.
rusqlite = { version = "0.43" }
libsqlite3-sys = { version = "0.40", features = ["bundled"] }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
xai-grok-config = { workspace = true }
xai-sqlite-journal = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
