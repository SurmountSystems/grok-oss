[package]
license = "Apache-2.0"
name = "xai-grok-memory"
version = "0.1.0"
edition.workspace = true

[features]
# Exposes `#[cfg(test)]`-only helpers (`MemoryStorage::with_paths`,
# `MockEmbeddingProvider`) to downstream crates' test targets.
test-support = []

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
dunce = { workspace = true }
flate2 = { workspace = true }
git2 = { version = "0.21", default-features = false, features = [
    "vendored-libgit2",
] }
libc = { workspace = true }
notify = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
reqwest-middleware = { workspace = true }
# rusqlite 0.43. libsqlite3-sys `bundled` keeps SQLite self-contained (FTS5).
# Required libsqlite3-sys is 0.40.0.
rusqlite = { version = "0.43" }
libsqlite3-sys = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
# sqlite-vec: vec0 virtual table for KNN vector search.
sqlite-vec = "=0.1.7-alpha.2"
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
xai-grok-auth = { workspace = true }
xai-grok-config-types = { workspace = true }
xai-grok-http = { workspace = true }
xai-grok-tools = { workspace = true }
xai-grok-version = { workspace = true }
xai-sqlite-journal = { workspace = true }
xai-token-estimation = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
filetime = { workspace = true }

[lints]
workspace = true
