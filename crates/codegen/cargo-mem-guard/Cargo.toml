# Workspace member. Isolated flake package `.#cargo-mem-guard` still uses a
# fileset root so crane does not load this parent workspace Cargo.toml.
[package]
name = "cargo-mem-guard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Memory-aware cargo wrapper: throttle jobs under pressure, restart with fewer jobs, optional mold"
authors = ["Surmount"]
publish = false

[[bin]]
name = "cargo-mem-guard"
path = "src/main.rs"

[lints]
workspace = true
