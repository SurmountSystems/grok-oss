# Workspace member. Isolated flake package `.#grok-nix-helper` still uses a
# fileset root so crane does not load this parent workspace Cargo.toml.
[package]
name = "grok-nix-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Nix CI helpers and git recon: retry, hermetic PATH, process-pin assert, put-history, import, join"
authors = ["Surmount"]
publish = false

[[bin]]
name = "grok-nix-helper"
path = "src/main.rs"

[lints]
workspace = true
